[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "raw2leica"
version = "0.3.0"
description = "A desktop RAW/JPEG bridge for Leica FOTOS experiments"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "rawpy>=0.27.1,<0.28", "Pillow>=12,<13", "numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
packaging = ["pyinstaller==6.22.3", "build==1.6.1"]

[project.scripts]
raw2leica = "raw2leica.app:main"

[tool.setuptools.packages.find]
include = ["raw2leica*"]

[tool.setuptools.package-data]
raw2leica = ["profiles/*.json", "assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
